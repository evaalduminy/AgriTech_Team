[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee_leaf_classifier"
version = "2.0.0"
description = "AgriTech Coffee Leaf Disease Classification - Hardened Pipeline"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tensorflow>=2.15.0,<2.19.0",
    "numpy>=1.23.5,<2.0.0",
    "pillow>=10.0.0",
    "split-folders>=0.5.1",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.2",
    "pyyaml>=6.0.1",
    "pytest>=7.4.0",
    "scipy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:tensorflow.*",
    "ignore::DeprecationWarning:h5py.*",
    "ignore::DeprecationWarning:pyreadline.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore::RuntimeWarning",
    "ignore::ImportWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.pylint.messages_control]
max-line-length = 120
fail-under = "9.0"
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "too-many-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements"
]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 120
